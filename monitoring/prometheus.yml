global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'mlops-backend'
    static_configs:
      - targets: ['mlops-backend:8000']

  - job_name: 'mlops-models'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Only scrape containers whose name starts with /mlops-model-
      - source_labels: [__meta_docker_container_name]
        regex: '/mlops-model-.*'
        action: keep
      # Scrape the model container directly on the compose network
      - source_labels: [__meta_docker_container_name]
        regex: '/(mlops-model-.*)'
        target_label: __address__
        replacement: '$1:8000'
      # Carry over useful labels from container metadata
      - source_labels: [__meta_docker_container_label_model_id]
        target_label: model_id
      - source_labels: [__meta_docker_container_label_model_name]
        target_label: model_name
      - target_label: job
        replacement: mlops-models