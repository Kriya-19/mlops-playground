global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "mlops-playground"

scrape_configs:

  # Scrape FastAPI backend metrics
  - job_name: "mlops-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Dynamically scrape deployed model containers
  # Each model exposes /metrics on its assigned port
  - job_name: "mlops-models"
    static_configs:
      - targets:
          - "host.docker.internal:8100"
          - "host.docker.internal:8101"
          - "host.docker.internal:8102"
          - "host.docker.internal:8103"
          - "host.docker.internal:8104"
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance